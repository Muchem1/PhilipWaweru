<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"><title>Improving geographical access to CT</title><rect width="900" height="520" fill="#1d242c"/><style>text{font-family:Arial,sans-serif;fill:#ecf0f5}.muted{fill:#b4bac2;font-size:14px}.label{font-size:17px}.value{fill:#9ac7ff;font-size:22px}.small{fill:#b4bac2;font-size:12px}</style><text x="42" y="48" font-size="25">Improving geographical access to CT</text><text x="42" y="78" class="muted">Estimated population coverage within 30 minutes</text><text x="42" y="155" class="label">Existing CT network</text><rect x="42" y="175" width="700" height="28" fill="#384352"/><rect x="42" y="175" width="551.39" height="28" fill="#8495ac"/><text x="770" y="198" class="value">78.77%</text><text x="42" y="265" class="label">With 98 additional sites</text><rect x="42" y="285" width="700" height="28" fill="#384352"/><rect x="42" y="285" width="636.86" height="28" fill="#9ac7ff"/><text x="770" y="308" class="value">90.98%</text><text x="42" y="405" font-size="29" fill="#9ac7ff">+12.21 percentage points within 30 minutes</text><path d="M42 470H858" stroke="#454d5a"/><text x="42" y="495" class="small">Modelled scenario: 155 existing sites; 98 additional sites. Not measured implementation impact.</text></svg>