<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"><title>Improving geographical access to CT</title><rect width="900" height="520" fill="#19261d"/><style>text{font-family:Arial,sans-serif;fill:#edf1e4}.muted{fill:#afbdad;font-size:14px}.label{font-size:17px}.value{fill:#cfef88;font-size:22px}.small{fill:#afbdad;font-size:12px}</style><text x="42" y="48" font-size="25">Improving geographical access to CT</text><text x="42" y="78" class="muted">Estimated population coverage within 30 minutes</text><text x="42" y="155" class="label">Existing CT network</text><rect x="42" y="175" width="700" height="28" fill="#344731"/><rect x="42" y="175" width="551.39" height="28" fill="#7e9c6c"/><text x="770" y="198" class="value">78.77%</text><text x="42" y="265" class="label">With 98 additional sites</text><rect x="42" y="285" width="700" height="28" fill="#344731"/><rect x="42" y="285" width="636.86" height="28" fill="#cfef88"/><text x="770" y="308" class="value">90.98%</text><text x="42" y="405" font-size="29" fill="#cfef88">+12.21 percentage points within 30 minutes</text><path d="M42 470H858" stroke="#40513e"/><text x="42" y="495" class="small">Modelled scenario: 155 existing sites; 98 additional sites. Not measured implementation impact.</text></svg>